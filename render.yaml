# Alternative Render Blueprint for ClaimSight. Current Cloud Run notes:
# docs/deployment/README.md (external storage/mount settings are configured separately).
#
# Three web services, all free tier, all from Docker:
#   claimsight-a2a         the CrewAI back office behind the A2A protocol
#                          (./Dockerfile -> src/a2a_server.py + the 6 MCP tools)
#   claimsight-assistant   the Google ADK claimant assistant, ADK web chat UI
#                          (./Dockerfile.assistant -> adk web agents)
#   claimsight-dashboard   read-only Streamlit workspace (./Dockerfile.dashboard)
#
# This satisfies the assessment rule that nothing runs from the laptop: the
# grader opens the assistant's public URL, which calls the A2A service, which
# runs the CrewAI crews - all three hops are hosted here.
#
# How to use: push this repo to GitHub, then on Render: New + -> Blueprint ->
# pick this repo. Render reads this file and creates both services. You then
# paste the three secrets (see sync:false below) in each service's Environment
# tab. Full click-through: docs/deployment/RENDER.md.
#
# NOTE on the URLs below: a Render service is reachable at
#   https://<service-name>.onrender.com
# The name is taken if someone else already used it, in which case Render adds a
# suffix. After the FIRST deploy, check each service's real URL at the top of its
# page and, if it differs, correct A2A_PUBLIC_URL and CLAIMSIGHT_A2A_URL to match
# (then redeploy the affected service). docs/deployment/RENDER.md walks through this.

services:
  # ---------------------------------------------------------------- CrewAI A2A server
  - type: web
    name: claimsight-a2a
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /.well-known/agent-card.json
    envVars:
      # The Groq key the crews call (free tier). Paste it in the dashboard.
      - key: GROQ_API_KEY
        sync: false
      # Policy-clause embeddings via Gemini's API (no model loaded into RAM, so
      # it fits the 512 MB free tier). Big chunks keep the first-build call count
      # low enough for the free rate limit - see assessment_crew.py. Reads the
      # GOOGLE_API_KEY below (same free key as the assistant).
      - key: CLAIMSIGHT_EMBEDDER
        value: google
      - key: GOOGLE_API_KEY
        sync: false
      # The public URL the agent card advertises; the assistant reads the card
      # and then calls this, so it MUST be this service's real public URL.
      - key: A2A_PUBLIC_URL
        value: https://claimsight-a2a.onrender.com

  # ---------------------------------------------------------------- ADK assistant
  - type: web
    name: claimsight-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile.assistant
    plan: free
    region: oregon
    envVars:
      # The free Google AI Studio key that drives the Gemini assistant.
      - key: GOOGLE_API_KEY
        sync: false
      # Where the assistant finds the CrewAI system: the A2A service's public URL.
      - key: CLAIMSIGHT_A2A_URL
        value: https://claimsight-a2a.onrender.com

  # ---------------------------------------------------------------- Streamlit dashboard
  # Presentation mode: replays saved results, calls no model. Deliberately has
  # NO GROQ_API_KEY / GOOGLE_API_KEY - with a Groq key, the dashboard's "Live
  # assessment" mode would let any visitor spend tokens. No secrets at all.
  - type: web
    name: claimsight-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile.dashboard
    plan: free
    region: oregon
    healthCheckPath: /_stcore/health
    envVars:
      # Belt and braces: also set in Dockerfile.dashboard. Turns off Langfuse
      # and the vision model client inside the dashboard container.
      - key: CLAIMSIGHT_OFFLINE
        value: "1"
