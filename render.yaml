# Render Blueprint for ClaimSight - the whole system, fully in the cloud.
#
# Two web services, both free tier, both from Docker:
#   claimsight-a2a         the CrewAI back office behind the A2A protocol
#                          (./Dockerfile -> src/a2a_server.py + the 6 MCP tools)
#   claimsight-assistant   the Google ADK claimant assistant, ADK web chat UI
#                          (./Dockerfile.assistant -> adk web agents)
#
# This satisfies the assessment rule that nothing runs from the laptop: the
# grader opens the assistant's public URL, which calls the A2A service, which
# runs the CrewAI crews - all three hops are hosted here.
#
# How to use: push this repo to GitHub, then on Render: New + -> Blueprint ->
# pick this repo. Render reads this file and creates both services. You then
# paste the three secrets (see sync:false below) in each service's Environment
# tab. Full click-through: RENDER_DEPLOY.md.
#
# NOTE on the URLs below: a Render service is reachable at
#   https://<service-name>.onrender.com
# The name is taken if someone else already used it, in which case Render adds a
# suffix. After the FIRST deploy, check each service's real URL at the top of its
# page and, if it differs, correct A2A_PUBLIC_URL and CLAIMSIGHT_A2A_URL to match
# (then redeploy the affected service). RENDER_DEPLOY.md walks through this.

services:
  # ---------------------------------------------------------------- CrewAI A2A server
  - type: web
    name: claimsight-a2a
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /.well-known/agent-card.json
    envVars:
      # The Groq key the crews call (free tier). Paste it in the dashboard.
      - key: GROQ_API_KEY
        sync: false
      # Policy-clause embeddings run IN the container (chromadb MiniLM via
      # onnxruntime): no API key, no quota, no rate limits, no local ollama.
      # This is why the server needs no GOOGLE_API_KEY.
      - key: CLAIMSIGHT_EMBEDDER
        value: onnx
      # The public URL the agent card advertises; the assistant reads the card
      # and then calls this, so it MUST be this service's real public URL.
      - key: A2A_PUBLIC_URL
        value: https://claimsight-a2a.onrender.com

  # ---------------------------------------------------------------- ADK assistant
  - type: web
    name: claimsight-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile.assistant
    plan: free
    region: oregon
    envVars:
      # The free Google AI Studio key that drives the Gemini assistant.
      - key: GOOGLE_API_KEY
        sync: false
      # Where the assistant finds the CrewAI system: the A2A service's public URL.
      - key: CLAIMSIGHT_A2A_URL
        value: https://claimsight-a2a.onrender.com
